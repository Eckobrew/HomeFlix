name: Mobile API
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx next lint --file 'src/app/api/mobile/v1/[...path]/route.ts'
      - run: npm run test:mobile
